name: Playwright Tests for Swag Labs

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch: # Allows us to manually trigger the workflow from the GitHub Actions UI

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check types
        run: yarn type-check

      - name: Check formatting
        run: yarn format:check

  test:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: login
            command: test:login
          - suite: inventory
            command: test:inventory
          - suite: cart
            command: test:cart
          - suite: checkout
            command: test:checkout
          - suite: inventory-details
            command: test:inventory-details
          - suite: smoke
            command: test:smoke

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Chromium and system dependencies
        run: yarn playwright install --with-deps chromium

      - name: Run ${{ matrix.suite }} tests
        run: yarn ${{ matrix.command }}

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report-${{ matrix.suite }}
          path: playwright-report
          retention-days: 3
